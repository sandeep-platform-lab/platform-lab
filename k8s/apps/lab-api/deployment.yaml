# lab-api, deployed by Argo CD from this folder. The version is set ONCE, in kustomization.yaml
# (images.newTag); Kustomize fills in the image below and copies the tag into APP_VERSION.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-api
  labels: { app: lab-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: lab-api }
  template:
    metadata:
      labels: { app: lab-api }
    spec:
      imagePullSecrets:
        - name: jfrog-pull   # created by hand, never in git (docs/day07.md)
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: lab-api
          image: lab-api   # set by kustomization.yaml
          ports:
            - containerPort: 8000
          env:
            - { name: APP_VERSION, value: "set-by-kustomize" }
            - { name: APP_ENV, value: "lab-k3d" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
