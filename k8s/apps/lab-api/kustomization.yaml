# The single place where the running version is declared. To release: promote build N with the
# promote workflow, then change newTag here in a PR. Merging the PR is the deployment.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
images:
  - name: lab-api
    newName: trial2t284t.jfrog.io/lab-docker-prod-local/lab-api
    newTag: "1.0.26"
# APP_VERSION always equals the image tag, so the two can never drift apart again.
replacements:
  - source:
      kind: Deployment
      name: lab-api
      fieldPath: spec.template.spec.containers.[name=lab-api].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: lab-api
        fieldPaths:
          - spec.template.spec.containers.[name=lab-api].env.[name=APP_VERSION].value
